<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../logo2.png" type="image/png">

  <title data-i18n="nav.manageUsers">Gestionar usuarios</title>
  <link href="../output.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</head>

<body class="bg-gradient-to-r from-blue-50 to-indigo-50 min-h-screen flex flex-col">
  <div class="flex-grow">

    <!-- Header con menú móvil -->
    <header class="bg-primary-light text-white flex items-center justify-between px-6 py-4 rounded-b-lg shadow-md">
      <div class="flex items-center space-x-4">
        <img src="../assets/svg/icono.svg" alt="Icono Labofam" class="h-10 w-auto filter invert" />
        <img src="../assets/svg/logo.svg" alt="Labofam" class="h-6 w-auto filter invert" />
      </div>
      <div class="flex items-center space-x-4">
        <!-- Botón hamburguesa visible en móvil -->
        <button id="nav-toggle" class="md:hidden focus:outline-none">
          <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        <!-- Navegación de escritorio -->
        <nav class="hidden md:flex space-x-6">
          <a href="./inicio.html" class="hover:bg-white/20 px-4 py-2 rounded">Inicio</a>
          <a href="./estadisticas.html" class="hover:bg-white/20 px-4 py-2 rounded">Estadísticas</a>
          <a id="manageUsersNavLink" href="./gestionar-usuarios.html" class="hover:bg-white/20 px-4 py-2 rounded" style="display: none;" data-i18n="nav.manageUsers">Gestionar usuarios</a>
        </nav>
      </div>
    </header>

    <!-- Menú móvil desplegable -->
    <nav id="mobile-nav" class="bg-primary-light text-white hidden md:hidden">
      <div class="flex flex-col px-6 py-4 space-y-2">
        <a href="./inicio.html" class="block py-2 hover:bg-primary-light/20 rounded">Inicio</a>
        <a href="./estadisticas.html" class="block py-2 hover:bg-primary-light/20 rounded">Estadísticas</a>
        <a id="manageUsersNavLinkMobile" href="./gestionar-usuarios.html" class="block py-2 hover:bg-primary-light/20 rounded" style="display: none;" data-i18n="nav.manageUsers">Gestionar usuarios</a>
      </div>
    </nav>

    <!-- Page title and create button -->
    <div class="mt-6 mx-6 flex justify-between items-center">
      <h1 class="text-2xl font-semibold text-gray-800" data-i18n="modals.manageUsers.pageTitle">Gestionar usuarios</h1>
      <button id="btn-create-user" class="bg-primary-light text-white px-4 py-2 rounded-lg hover:bg-primary-dark transition flex items-center gap-2">
        <span>+ </span><span data-i18n="modals.manageUsers.buttons.create">Crear usuario</span>
      </button>
    </div>

    <!-- Users table -->
    <main class="bg-white mt-4 mx-6 p-6 rounded-lg shadow-sm">
      <div id="users-message" class="text-gray-500 mb-4" data-i18n="messages.loading">Cargando...</div>
      <table id="users-table" class="w-full text-left hidden">
        <thead>
          <tr class="border-b">
            <th class="pb-3 font-semibold text-gray-700" data-i18n="modals.manageUsers.table.identificador">Identificador</th>
            <th class="pb-3 font-semibold text-gray-700" data-i18n="modals.manageUsers.table.estudios">Cantidad de estudios</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
        </tbody>
      </table>
    </main>
  </div>

  <!-- Footer -->
  <footer class="bg-primary-light text-white py-2">
    <div class="max-w-6xl mx-auto px-4 flex flex-col items-center">
      <div class="flex space-x-6 mb-4">
        <a href="https://facebook.com/labofamchile" aria-label="Facebook" class="hover:text-primary-dark">
          <svg class="h-8 w-8" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.99H7.898v-2.888h2.54V9.845c0-2.507 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.242 0-1.63.771-1.63 1.562v1.875h2.773l-.443 2.888h-2.33v6.99C18.343 21.128 22 16.991 22 12z" />
          </svg>
        </a>
        <a href="https://twitter.com/labofamchile" aria-label="Twitter" class="hover:text-primary-dark">
          <svg class="h-8 w-8" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z" />
          </svg>
        </a>
        <a href="https://instagram.com/labofamchile" aria-label="Instagram" class="hover:text-primary-dark">
          <svg class="h-8 w-8" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.75 2h8.5A5.75 5.75 0 0122 7.75v8.5A5.75 5.75 0 0116.25 22h-8.5A5.75 5.75 0 012 16.25v-8.5A5.75 5.75 0 017.75 2zm0 1.5A4.25 4.25 0 003.5 7.75v8.5A4.25 4.25 0 007.75 20.5h8.5a4.25 4.25 0 004.25-4.25v-8.5A4.25 4.25 0 0016.25 3.5h-8.5zm8.75 1a.75.75 0 110 1.5.75.75 0 010-1.5zM12 7a5 5 0 110 10 5 5 0 010-10zm0 1.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7z" />
          </svg>
        </a>
      </div>
      <p class="text-base">© 2025 Labofam. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Create User Modal -->
  <div id="createUserModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="modals.manageUsers.title">Crear usuario</h3>
        <button id="modal-close" class="modal-close">&times;</button>
      </div>
      <div class="modal-content">
        <form id="create-user-form">
          <div class="form-group">
            <label for="input-identificador" data-i18n="modals.manageUsers.fields.identificador">Identificador</label>
            <input type="text" id="input-identificador" required maxlength="100" class="w-full px-4 py-2 border rounded-lg" />
          </div>
          <div class="form-group">
            <label for="input-contrasena" data-i18n="modals.manageUsers.fields.contrasena">Contraseña</label>
            <input type="password" id="input-contrasena" required minlength="8" class="w-full px-4 py-2 border rounded-lg" />
          </div>
          <div class="form-group">
            <label data-i18n="modals.manageUsers.fields.estudios">Estudios</label>
            <p class="text-sm text-gray-500 mb-2" data-i18n="modals.manageUsers.fields.estudios.help">Selecciona uno o más estudios</p>
            <div id="estudios-checkboxes" class="space-y-2 max-h-48 overflow-y-auto border rounded-lg p-3">
              <!-- Populated via JS -->
            </div>
            <div id="estudios-error" class="text-red-500 text-sm mt-1 hidden" data-i18n="modals.manageUsers.errors.minOneStudy">Selecciona al menos un estudio</div>
          </div>
          <div id="form-message" class="mb-4 text-sm hidden"></div>
          <div class="button-container flex justify-end gap-3">
            <button type="button" id="btn-cancel" class="btn btn-secondary px-4 py-2 rounded-lg" data-i18n="modals.manageUsers.buttons.cancel">Cancelar</button>
            <button type="submit" class="btn save-btn bg-primary-light text-white px-4 py-2 rounded-lg hover:bg-primary-dark" data-i18n="modals.manageUsers.buttons.create">Crear usuario</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../../js/auth-helpers.js"></script>
  <script src="../../js/users.js" type="module"></script>
  <script>
    // Toggle móvil
    document.getElementById('nav-toggle').addEventListener('click', () => {
      document.getElementById('mobile-nav').classList.toggle('hidden');
    });

    // Conditional navbar: show "Gestionar usuarios" only if crear_usuario flag is true
    (function showManageUsersNav() {
      if (!window.getCurrentUser) return;
      const user = window.getCurrentUser();
      if (user.crear_usuario) {
        const desktopLink = document.getElementById('manageUsersNavLink');
        const mobileLink = document.getElementById('manageUsersNavLinkMobile');
        if (desktopLink) desktopLink.style.display = '';
        if (mobileLink) mobileLink.style.display = '';
      }
    })();
  </script>
</body>

</html>
